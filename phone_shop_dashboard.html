<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Phone shop Dashboard</title>

  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>

</head>

<body class="bg-gray-100">

  <div class="flex h-screen overflow-hidden">

    <!-- Sidebar -->
    <aside id="sidebar"
      class="fixed md:static top-0 left-0 z-50 w-64 h-full bg-[#0b1324] text-white flex flex-col justify-between transform -translate-x-full md:translate-x-0 transition-transform duration-300">

      <div>

        <!-- Logo -->
        <div class="flex items-center gap-3 px-5 py-4 border-b border-gray-700">
          <div class="flex items-center gap-3">
            <div class="w-8 h-8 rounded flex items-center justify-center">
              <img src="images/smartphone.png" alt="Mobile Icon" class="w-8 h-" 6 />
            </div>

            <h1 class="text-2xl font-bold">MobileShop</h1>

          </div>
          <button id="closeBtn" class="md:hidden text-3xl font-bold hover:text-pink-500">
            ✕
          </button>
        </div>
        
        <!-- Menu -->
        <div class="mt-6 px-4">

          <p class="text-gray-400 text-sm uppercase font-bold mb-4">
            Management
          </p>

          <a href="#" class="block bg-pink-500 px-4 py-3 rounded-xl font-semibold mb-2">
            Dashboard
          </a>

          <a href="#" class="block px-4 py-3 rounded-xl hover:bg-gray-800">
            Products
          </a>

          <a href="#" class="block px-4 py-3 rounded-xl hover:bg-gray-800">
            Orders
          </a>

          <a href="#" class="block px-4 py-3 rounded-xl hover:bg-gray-800">
            Users
          </a>

        </div>

      </div>

      <!-- Logout -->
      <!-- <div class="p-4 border-t border-gray-700"> -->
        
        <div class="absolute bottom-0 w-full p-4 border-t border-gray-700">
        <button class="w-full bg-gray-800 border border-gray-700 py-3 rounded-lg font-semibold hover:bg-gray-600">
          Logout
        </button>

      </div>

    </aside>

    <!-- Main Content -->
    <div class="flex-1 flex flex-col overflow-y-auto">

      <!-- Topbar -->
      <div class="bg-white border-b px-5 gap-3 py-3.5 flex items-center justify-between">

        <!-- Left -->
        <div class="flex items-center gap-5">

          <!-- Menu Button (Mobile Only) -->
          <button id="menuBtn" class="md:hidden text-black text-3xl ">
            <span id="icon" class="">☰</span>
          </button>


          <h2 class="text-2xl md:text-3xl font-bold text-gray-800">
            Dashboard
          </h2>

        </div>

      </div>

      <!--Main Container -->
      <div class="p-5">

        <!-- Cards -->
        <div class="grid sm:grid-cols-1 md:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-5">

          <!-- Card 1 -->
          <div class="bg-white rounded-2xl p-5 shadow-sm flex items-center gap-4">

            <div class="w-14 h-14 rounded-xl bg-green-100 flex items-center justify-center">
              <!-- <img src="dollar-sign.png" alt="Sales Icon" /> -->
               <p class="text-2xl font-bold">💲</p>
            </div>

            <div>
              <p class="text-gray-500">Total Sales</p>
              <h3 class="text-xl font-bold">$0.00</h3>
            </div>

          </div>

          <!-- Card 2 -->
          <div class="bg-white rounded-2xl p-5 shadow-sm flex items-center gap-4">

            <div class="w-14 h-14 rounded-xl bg-blue-100 flex items-center justify-center">
              <!-- <img src="shopping-cart.png" alt="Orders Icon" /> -->
              <p class="text-2xl font-bold">🛒</p>
            </div>

            <div>
              <p class="text-gray-500">Total Orders</p>
              <h3 class="text-xl font-bold">0</h3>
            </div>

          </div>

          <!-- Card 3 -->
          <div class="bg-white rounded-2xl p-5 shadow-sm flex items-center gap-4">

            <div class="w-14 h-14 rounded-xl bg-purple-100 flex items-center justify-center">
              <!-- <img src="people.png" alt="Customers Icon" /> -->
              <p class="text-2xl font-bold">👥</p>
            </div>

            <div>
              <p class="text-gray-500">Customers</p>
              <h3 class="text-xl font-bold">1</h3>
            </div>

          </div>

          <!-- Card 4 -->
          <div class="bg-white rounded-2xl p-5 shadow-sm flex items-center gap-4">

            <div class="w-14 h-14 rounded-xl bg-red-100 flex items-center justify-center">
              <!-- <img src="warning.png" alt="Low Stock Icon" /> -->
              <p class="text-2xl font-bold">⚠️</p>
            </div>

            <div>
              <p class="text-gray-500">Low Stock Items</p>
              <h3 class="text-xl font-bold">0</h3>
            </div>

          </div>

        </div>

        <!-- Table -->
        <div class="bg-white rounded-2xl shadow-sm mt-6 overflow-hidden">

          <!-- Header -->
          <div class="flex items-center justify-between px-5 py-4 border-b">

            <h3 class="text-xl md:text-2xl font-semibold">
              Recent Orders
            </h3>

            <a href="#" class="text-pink-500 font-semibold">
              View all »
            </a>

          </div>

          <div class="overflow-x-auto overflow-y-scroll max-h-[250px]">

            <table class="w-full min-w-[600px]">

              <thead class="bg-gray-50">

                <tr class="text-left text-gray-500 uppercase text-sm">

                  <th class="px-6 py-4">Order ID</th>
                  <th class="px-6 py-4">Customer</th>
                  <th class="px-6 py-4">Date</th>
                  <th class="px-6 py-4">Total</th>
                  <th class="px-6 py-4">Status</th>

                </tr>

              </thead>





            </table>

          </div>

        </div>

      </div>

    </div>

  </div>

  <!-- Overlay -->
  <div id="overlay" class="fixed inset-0 bg-black/40 hidden md:hidden"></div>

    const menuBtn = document.getElementById("menuBtn");
    const sidebar = document.getElementById("sidebar");
    const overlay = document.getElementById("overlay");

    // Open Sidebar
    menuBtn.addEventListener("click", () => {
      sidebar.classList.remove("-translate-x-full");
      overlay.classList.remove("hidden");
    });

    // Close Sidebar
    overlay.addEventListener("click", () => {
      sidebar.classList.add("-translate-x-full");
      overlay.classList.add("hidden");
    });

  </script> -->
  
  <!-- JavaScript -->
  <script>

    const menuBtn = document.getElementById("menuBtn");
    const closeBtn = document.getElementById("closeBtn");
    const sidebar = document.getElementById("sidebar");
    // const overlay = document.getElementById("overlay");

    // Open Sidebar
    menuBtn.addEventListener("click", () => {
      sidebar.classList.remove("-translate-x-full");
      overlay.classList.remove("hidden");
    });

    // Close Sidebar with X button
    closeBtn.addEventListener("click", () => {
      sidebar.classList.add("-translate-x-full");
      overlay.classList.add("hidden");
    });

    

  </script>

</body>

</html>
